<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon">
      <img src="brand/costalito-logo.jpg" alt="Logo de Costalito Smart">
    </div>
    <div>
      <h1>Costalito Smart</h1>
      <p>El pulso de tu granero</p>
    </div>
  </div>

  <nav class="menu" aria-label="Navegación principal">
    @for (opcion of opciones; track opcion.ruta) {
    <a [routerLink]="opcion.ruta"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: opcion.ruta === '/' }"
       [attr.aria-label]="opcion.nombre"
       [attr.title]="opcion.nombre">
      <b class="inicial">{{ opcion.nombre.charAt(0) }}</b>
      <span>{{ opcion.nombre }}</span>
    </a>
    }
  </nav>

  <div class="user-card">
    <div class="avatar">JC</div>
    <div>
      <strong>Administrador</strong>
      <span>Granero Costalito</span>
    </div>
  </div>
</aside>
