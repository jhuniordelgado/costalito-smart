<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon">
      <img src="brand/costalito-logo.jpg" alt="Logo de Costalito Smart">
    </div>
    <div>
      <h1>Costalito Smart</h1>
      <p>El pulso de tu granero</p>
    </div>
  </div>

  <nav class="menu" aria-label="Navegación principal">
    @for (opcion of opciones; track opcion.ruta) {
    <a [routerLink]="opcion.ruta"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: opcion.ruta === '/' }"
       [attr.aria-label]="opcion.nombre"
       [attr.title]="opcion.nombre">
      <b class="inicial">{{ opcion.nombre.charAt(0) }}</b>
      <span>{{ opcion.nombre }}</span>
    </a>
    }
  </nav>

  @if (sesion.usuario(); as usuario) {
  <div class="user-card">
    <div class="avatar" aria-hidden="true">{{ sesion.iniciales() }}</div>
    <div class="user-datos">
      <strong>{{ usuario.nombre }}</strong>
      <span>{{ usuario.rol === 'ADMIN' ? 'Administrador' : 'Vendedor' }}</span>
    </div>
    <button type="button" class="salir" (click)="salir()" [disabled]="saliendo()"
            title="Cerrar sesión" aria-label="Cerrar sesión">
      Salir
    </button>
  </div>
  }
</aside>
