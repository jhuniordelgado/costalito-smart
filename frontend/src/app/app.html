<div class="app-shell">
  <aside class="sidebar">

      <div class="brand-icon">CS</div>

        <h1>Costalito Smart</h1>
        <p>ERP Autogestionable</p>
      </div>
    </div>

    <nav class="menu">
      <a routerLink="/" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">🏠 <span>Inicio</span></a>

      <a routerLink="/ventas" routerLinkActive="active">💰 <span>Ventas</span></a>

      <a routerLink="/inteligencia" routerLinkActive="active">🧠 <span>Inteligencia</span></a>
      <a routerLink="/administracion" routerLinkActive="active">
        ⚙️ <span>Administración</span>
      </a>
    </nav>

    <div class="user-card">
      <div class="avatar">JC</div>
      <div>
        <strong>Administrador</strong>
        <span>Granero Costalito</span>
      </div>
    </div>

  <main class="main-content">
